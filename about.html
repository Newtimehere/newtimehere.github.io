<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us - NEW TIME MAGAZINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        background-color: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding: 32px 20px 20px 20px;
    }

    .magazine-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: 42px;
        font-weight: 400;
        letter-spacing: 8px;
        color: #ffffff;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 18px;
        line-height: 1;
    }

    .magazine-image {
        max-width: 100%;
        width: auto;
        height: auto;
        max-height: 82vh;
        display: block;
        box-shadow: 0 10px 40px rgba(255,255,255,0.1);
    }

    @media (max-width: 768px) {
        body {
            padding: 24px 16px 16px 16px;
        }
        .magazine-title {
            font-size: 28px;
            letter-spacing: 5px;
            margin-bottom: 14px;
        }
    }

    @media (max-width: 480px) {
        body {
            padding: 20px 12px 12px 12px;
        }
        .magazine-title {
            font-size: 22px;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }
    }
</style>
</head>
<body>
    <h1 class="magazine-title">New Time Magazine</h1>
    <img class="magazine-image" src="magazine-666.jpg" alt="New Time Magazine">
</body>
</html>
