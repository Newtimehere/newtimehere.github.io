<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW TIME MAGAZINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        background-color: #000000;
        font-family: 'Inter', sans-serif;
        color: #ffffff;
    }

    .header {
        padding: 32px 20px;
        text-align: center;
    }

    .logo {
        font-family: 'Cormorant Garamond', serif;
        font-size: 42px;
        font-weight: 400;
        letter-spacing: 8px;
        text-transform: uppercase;
        margin-bottom: 24px;
    }

    nav {
        display: flex;
        justify-content: center;
        gap: 40px;
        flex-wrap: wrap;
    }

    nav a {
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding: 8px 0;
        border-bottom: 1px solid transparent;
        transition: all 0.3s ease;
    }

    nav a:hover {
        border-bottom: 1px solid #ffffff;
    }

    @media (max-width: 768px) {
        .logo {
            font-size: 28px;
            letter-spacing: 5px;
        }
        nav {
            gap: 24px;
        }
        nav a {
            font-size: 13px;
        }
    }
</style>
</head>
<body>
    <div class="header">
        <div class="logo">NEW TIME MAGAZINE</div>
        <nav>
            <a href="index.html">HOME</a>
            <a href="about.html">NEW TIME MAGAZINE</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </div>
</body>
</html>
