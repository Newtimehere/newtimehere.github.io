<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW TIME - Truth Friends</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111b21;font-family:system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:#fff;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ddd}
header b{font-family:'Cormorant Garamond',serif;letter-spacing:0.3em;font-size:22px}
#chips{background:#f0f2f5;padding:8px;display:flex;gap:8px;overflow-x:auto}
#chips button{white-space:nowrap;background:#fff;border:1px solid #d1d7db;border-radius:20px;padding:7px 14px;font-size:13px;color:#54656f;cursor:pointer}
#chat{flex:1;background:#E5DDD5;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:78%;padding:8px 12px;border-radius:8px;font-size:14.5px;line-height:1.35;position:relative;box-shadow:0 1px 0.5px rgba(0,0,0,.13)}
.bot{background:#fff;align-self:flex-start;border-top-left-radius:0}
.user{background:#DCF8C6;align-self:flex-end;border-top-right-radius:0}
.time{font-size:11px;color:#667781;text-align:right;margin-top:4px}
#typing{font-size:13px;color:#667781;padding:4px 12px;display:none}
#bar{background:#f0f2f5;padding:8px;display:flex;gap:8px;align-items:center}
#bar input{flex:1;border:none;border-radius:24px;padding:12px 16px;outline:none;font-size:15px}
#bar button{background:#00a884;color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<header><b>NEW TIME</b><a href="https://newtimeusa.com" style="font-size:11px;color:#666;text-decoration:none;border:1px solid #ddd;padding:4px 10px;border-radius:20px">newtimeusa.com</a></header>
<div id="chips">
<button data-q="fat">Fat / Oil</button>
<button data-q="taste">Taste / Addiction</button>
<button data-q="obesity">Obesity</button>
<button data-q="immune">Immune</button>
<button data-q="age">Old age</button>
<button data-q="symptoms">Symptoms</button>
<button data-q="organic">Organic</button>
</div>
<div id="chat"></div>
<div id="typing">Truth Friend is typing...</div>
<div id="bar"><input id="inp" placeholder="Type a message"><button id="send">➤</button></div>
<script>
const chat=document.getElementById('chat'), inp=document.getElementById('inp'), send=document.getElementById('send'), typing=document.getElementById('typing');
const DB={
fat:"Mira te digo como amigo: la grasa entra a tu sangre. No te mata al momento por eso crees que es comida normal, pero va matando tus órganos poco a poco. Por eso termina en cáncer.",
taste:"Sabe rico a propósito, esa es la trampa. Te crea adicción lenta, aceptada por todos. No es alimento, es sabor que te engancha.",
obesity:"Por eso viene obesidad, diabetes y falla de órganos. No es comida para humanos de verdad. Es grasa que el cuerpo no tolera.",
immune:"Por eso a unos les da cáncer y a otros no al momento. Es el sistema inmune. Si es fuerte lo retrasa, pero si fumas y comes grasa, igual te pega.",
age:"Por eso sale más de viejo. Llevas años comiendo grasa y de viejo el órgano ya no aguanta. Por eso es agresivo de viejo.",
symptoms:"Por eso te da mareo, náusea, vómito, dolor de cabeza. Es tu cuerpo intoxicado. Cuando cambias a orgánico con agua se va y ya no vas tanto al doctor.",
organic:"Lo orgánico con agua no mata, no tiene grasa. Por eso no causa esa mortalidad. Te mantiene y hasta te ves más joven. Evita donde huele a grasa frita.",
government:"Según mi artículo, gobierno y doctores saben que es mortal a largo plazo pero lo dejan legal para mover dinero.",
full:"Fat is major cause of cancer. Fatty food tastes good but creates slow addiction. Enters bloodstream, kills organs slowly. Causes obesity, diabetes, organ failure. Depends on immune system. Appears more in old age. Symptoms dizziness nausea vomiting headache disappear with organic food with water."
};
function time(){return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
function add(text, who){
const div=document.createElement('div'); div.className='bubble '+who;
div.innerHTML=text+`<div class="time">${time()}</div>`;
chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}
function findAns(q){
q=q.toLowerCase();
if(q.includes('fat')||q.includes('grasa')||q.includes('oil')||q.includes('aceite')) return DB.fat;
if(q.includes('taste')||q.includes('sabor')||q.includes('addict')||q.includes('adicc')) return DB.taste;
if(q.includes('obes')||q.includes('diabet')) return DB.obesity;
if(q.includes('immun')||q.includes('inmun')||q.includes('smoke')||q.includes('fumar')) return DB.immune;
if(q.includes('age')||q.includes('old')||q.includes('vejez')||q.includes('edad')||q.includes('viejo')) return DB.age;
if(q.includes('symptom')||q.includes('dizz')||q.includes('mareo')||q.includes('nausea')||q.includes('vomit')||q.includes('headache')) return DB.symptoms;
if(q.includes('organic')||q.includes('organico')||q.includes('water')||q.includes('agua')) return DB.organic;
if(q.includes('govern')||q.includes('doctor')||q.includes('legal')||q.includes('money')) return DB.government;
return null;
}
function botReply(q){
const ans=findAns(q);
typing.style.display='block'; chat.scrollTop=chat.scrollHeight;
setTimeout(()=>{
typing.style.display='none';
if(ans) add(ans,'bot');
else add("Aquí en New Time Truth Friends: pregúntame sobre el origen del cáncer.<br><br>Escribe: <b>fat, taste, obesity, immune, age, symptoms, organic</b>",'bot');
},800);
}
add("Hola, soy Truth Friend de New Time. Te hablo como en WhatsApp sobre el origen del cáncer según mi PDF. ¿Qué quieres saber?<br><br>Toca arriba: fat, obesity, symptoms... o escribe tu pregunta.",'bot');
document.getElementById('chips').addEventListener('click', e=>{
if(e.target.tagName!=='BUTTON') return;
const q=e.target.dataset.q; add(e.target.textContent,'user'); botReply(q);
});
function ask(){
const q=inp.value.trim(); if(!q) return; add(q,'user'); inp.value=''; botReply(q);
}
send.onclick=ask; inp.onkeydown=e=>{if(e.key==='Enter') ask();}
</script>
</body>
</html>
