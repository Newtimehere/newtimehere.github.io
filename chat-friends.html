<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW TIME - FRIENDS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow-x:hidden}
header{position:fixed;top:0;left:0;right:0;height:62px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:100}
header .logo{display:flex;align-items:center;gap:10px;font-family:serif;letter-spacing:4px;color:#000;font-size:20px}
header .logo i{width:36px;height:36px;border:1.5px solid #7A0000;border-radius:2px 2px 12px 12px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#7A0000}
.menu{width:28px;height:18px;display:flex;flex-direction:column;justify-content:space-between}
.menu span{height:2px;background:#000;display:block}

.hero{margin-top:62px;position:relative;height:88vh;background:#111}
.hero img{width:100%;height:100%;object-fit:cover;opacity:0.7}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.8) 70%)}
.hero-text{position:absolute;left:24px;right:24px;bottom:50px;z-index:2}
.hero-text h1{font-family:serif;font-size:44px;letter-spacing:10px;font-weight:300;margin-bottom:18px}
.hero-text p{font-size:16px;line-height:1.6;opacity:0.85;max-width:340px;margin-bottom:28px;font-weight:300}
.explore{display:flex;align-items:center;gap:14px;cursor:pointer}
.explore .c{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.18);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:22px}
.explore b{letter-spacing:3px;font-size:13px;font-weight:400}

/* BOLITA INFERIOR - NEGRO BIEN NEGRO + ROJO OSCURO */
#nt-friends-btn{
  position:fixed;
  bottom:14px;
  right:14px;
  width:58px;height:58px;
  background:#0A0A0A;
  border:1.5px solid rgba(255,255,255,0.15);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;z-index:99999;
  box-shadow:0 4px 20px rgba(0,0,0,0.6);
}
#nt-friends-btn svg{width:28px;height:28px}
.nt-dir-item{display:block;padding:12px 16px;margin:8px 0;background:#000;color:#fff;border-radius:30px;cursor:pointer;font-size:14px}
</style>
</head>
<body>

<header>
  <div class="logo"><i>M</i> NEW TIME</div>
  <div class="menu"><span></span><span></span><span></span></div>
</header>

<div class="hero">
  <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=1000" alt="friends">
  <div class="hero-overlay"></div>
  <div class="hero-text">
    <h1>FRIENDS</h1>
    <p>At New Time we are not only high-class, high-level. We are day by day, hand in hand with you.</p>
    <div class="explore" id="nt-explore-btn">
      <div class="c">→</div>
      <b>EXPLORE FRIENDS</b>
    </div>
  </div>
</div>

<!-- BOLITA -->
<button id="nt-friends-btn">
  <svg viewBox="0 0 24 24" fill="none">
    <path d="M4.5 5.8C4.5 4.4 5.7 3.2 7.1 3.2H16.9C18.3 3.2 19.5 4.4 19.5 5.8V12.2C19.5 13.6 18.3 14.8 16.9 14.8H9.2L4.5 19.5V5.8Z" stroke="#7A0000" stroke-width="1.7" fill="rgba(120,0,0,0.18)"/>
    <circle cx="8.2" cy="9" r="1.4" fill="#B00000"/>
    <circle cx="12" cy="9" r="1.4" fill="#B00000"/>
    <circle cx="15.8" cy="9" r="1.4" fill="#B00000"/>
  </svg>
</button>

<!-- CHAT -->
<div id="nt-chat-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999998; align-items:flex-end; justify-content:center;">
  <div style="background:#fff; width:100%; max-width:500px; height:85vh; border-radius:20px 20px 0 0; display:flex; flex-direction:column;">
    <div style="background:#000; color:#fff; padding:16px; display:flex; justify-content:space-between; align-items:center;">
      <b>NEW TIME - Chat Friends</b><span id="nt-close" style="cursor:pointer; font-size:24px;">✕</span>
    </div>
    <div id="nt-msgs" style="flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:#fff;"></div>
    <div style="padding:12px; border-top:1px solid #ddd; display:flex; gap:8px; background:#fff;">
      <input id="nt-input" placeholder="Ask..." style="flex:1; padding:14px 18px; border:1px solid #ddd; border-radius:30px; outline:none; font-size:16px; color:#000;">
      <button id="nt-send" style="background:#000; color:#fff; border:none; width:52px; height:52px; border-radius:50%; cursor:pointer;">→</button>
    </div>
  </div>
</div>

<script>
const ov=document.getElementById('nt-chat-overlay'), btn=document.getElementById('nt-friends-btn'), exp=document.getElementById('nt-explore-btn'), closeBtn=document.getElementById('nt-close'), msgs=document.getElementById('nt-msgs'), inp=document.getElementById('nt-input'), send=document.getElementById('nt-send');
function openChat(){ ov.style.display='flex'; }
btn.onclick=openChat;
exp.onclick=openChat;
closeBtn.onclick=()=>ov.style.display='none';
ov.onclick=e=>{ if(e.target===ov) ov.style.display='none'; };

function add(html, who){
  const d=document.createElement('div');
  d.style.cssText= who==='user' ? 'background:#000;color:#fff;padding:12px 16px;border-radius:18px 18px 4px 18px;align-self:flex-end;max-width:80%;font-size:15px;' : 'background:#fff;color:#111;padding:14px 16px;border-radius:18px;border:1px solid #e5e5e5;align-self:flex-start;max-width:92%;line-height:1.6;font-size:15px;';
  if(who==='bot') d.innerHTML=html; else d.textContent=html;
  msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
}
const answers={
"Origins of disabled people":"As your friend talking to YOU directly: Everything has its origin, nothing can exist if an origin does not exist...",
"Origins of cancer":"Talking to YOU directly as your friend: Food with fat has a good taste, but the taste is to convince you and the hidden effect is cancer...",
"Same-sex gender fraud mindset":"Look at me as your honest friend with the truth, talking to YOU: Since sex is with humans...",
"Origins of infidelity":"Infidelity is not a mistake it is committed consciously...",
"Origins of suicides":"Suicides mostly are because of love infidelity...",
"Origins of being woman and men":"Pleas are always because of fear of infidelity...",
"Origins of assassins":"Movies of violence, music are animations to excite your feelings...",
"The money and the effect":"Money is a scam the worldwide circus...",
"Human love":"Human love is decision not emotion."
};
function makeDir(){ return Object.keys(answers).map(n=>`<div class="nt-dir-item" data-title="${n}">👉 ${n}</div>`).join(''); }
function greeting(){ return `Hey here I am I am Chat Friends from New Time, here the differences of me with the Directory is that I talk to you here directly as your friend 100%.<br><br>${makeDir()}`; }
function showAnswer(t){ return `<b>${t}</b><br><br>${answers[t]}`; }
add(greeting(),'bot');
msgs.addEventListener('click', e=>{ const it=e.target.closest('.nt-dir-item'); if(!it) return; add(it.dataset.title,'user'); setTimeout(()=> add(showAnswer(it.dataset.title),'bot'),200); });
function ask(){ if(!inp.value.trim()) return; const q=inp.value.trim(); add(q,'user'); inp.value=''; const l=q.toLowerCase(); let f=null; if(l.includes('cancer')) f="Origins of cancer"; else if(l.includes('disab')) f="Origins of disabled people"; else if(l.includes('infidel')) f="Origins of infidelity"; else if(l.includes('suicid')) f="Origins of suicides"; else if(l.includes('woman')) f="Origins of being woman and men"; else if(l.includes('assassin')) f="Origins of assassins"; else if(l.includes('money')) f="The money and the effect"; else if(l.includes('same')||l.includes('gender')) f="Same-sex gender fraud mindset"; else if(l.includes('love')) f="Human love"; setTimeout(()=>{ if(f) add(showAnswer(f),'bot'); else add(greeting(),'bot'); },200); }
send.onclick=ask; inp.onkeydown=e=>{ if(e.key==='Enter') ask(); };
</script>
</body>
</html>
