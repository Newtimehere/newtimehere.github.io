<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW TIME Chat Truth Friends</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f7f7;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
#nt-top{background:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e9e9e9}
#nt-top .nt-brand{font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:3px;text-transform:uppercase}
#nt-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff;margin:12px;border:1px solid #e5e5e5;border-radius:18px}
.nt-dir-item{display:block;padding:10px 0;color:#6B0000;cursor:pointer;font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:500;text-align:left;border:none;background:none}
.nt-sub{color:#222!important;font-size:15px!important;padding-left:12px!important;border-left:2px solid #e5e5e5!important}
</style>
</head>
<body>
<div id="nt-top"><div class="nt-brand">NEW TIME</div><a href="https://newtimeusa.com" style="text-decoration:none;color:#000;font-size:28px">✕</a></div>
<div id="nt-msgs"></div>
<div style="padding:12px;border-top:1px solid #ddd;display:flex;gap:8px;background:#fff">
<input id="nt-input" placeholder="Ask..." style="flex:1;padding:14px 18px;border:1px solid #ddd;border-radius:30px;outline:none">
<button id="nt-send" style="background:#000;color:#fff;border:none;width:52px;height:52px;border-radius:50%">→</button>
</div>
<script>
const msgs=document.getElementById('nt-msgs');
const DATA={
"Origins of cancer":{
"Why fat causes cancer":"La grasa entra a tu sangre. No te mata al momento pero va matando organos poco a poco. Por eso termina en cancer.",
"Why tasty but addictive":"Sabe rico a proposito, es trampa. Crea adiccion lenta aceptada por todos.",
"Obesity, diabetes":"Viene obesidad, diabetes y falla de organos. No es comida para humanos.",
"Immune system":"A unos les da cancer y a otros no al momento. Es sistema inmune.",
"Why old age":"Sale mas de viejo. Llevas anos comiendo grasa y organo ya no aguanta.",
"Symptoms":"Mareo, nausea, vomito, dolor cabeza. Cuerpo intoxicado. Con organico con agua se va.",
"Organic food":"Organico con agua no mata, no tiene grasa. Evita donde huele a grasa frita."
},
"Origins of disability":{"Causes":"Genetica, complicaciones al nacer, accidentes.","Prevention":"Cuidando embarazo y alimentacion.","Support":"Necesita respeto, no lastima."},
"Origins of gender identity":{"What is it":"Como persona se siente por dentro.","Respect":"Verdad con respeto construye."},
"Origins of infidelity":{"Why hurts":"Dano cae en victima, mata confianza.","Prevention":"Decir NO desde inicio si no te gusta."},
"Origins of suicides":{"Why":"Por amor, falta dinero, pasado malo.","Help":"Habla, busca ayuda. Tu vida vale."},
"Origins of relationships":{"Trust":"Confianza cuando dice verdad sin interes.","Value":"Dile: ese vestido te queda super. No mientas."},
"Origins of violence":{"Media":"Peliculas violentas legales para mover dinero, no cuidar salud.","Money":"Sistema economico obliga por necesidad."},
"Money and effect":{"Control":"Te controlan porque tienes que comer, vestir.","Free":"Gratis es libertad, pierden control."},
"Human love":{"Real vs fake":"Si busca dinero y sexo, no es amor, es fraude.","Mutual":"Lo dificil es que amor sea mutuo."},
"Intelligence life":{"Best age":"Tener hijos joven es error. Minimo 30-39, cerebro maduro.","Present":"Futuro no existe, presente crea pasado."},
"The street mindset":{"Happiness":"Pensamientos fraudulentos que te dan felicidad a cambio de fraude.","Effect":"Ves apariencia vs efecto. Precio mismo es fraude."}
};
function add(h,w){const d=document.createElement('div');d.style.cssText=w==='user'?'background:#000;color:#fff;padding:12px 16px;border-radius:18px 18px 4px 18px;align-self:flex-end;max-width:80%':'background:#fff;padding:14px 16px;border-radius:18px;border:1px solid #e5e5e5;align-self:flex-start;max-width:92%';d.innerHTML=h;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}
function main(){return `Select:<br><br>${Object.keys(DATA).map(t=>`<div class="nt-dir-item" data-main="${t}">${t}</div>`).join('')}`;}
function sub(t){return `<b>${t}</b><br><br>${Object.keys(DATA[t]).map(k=>`<div class="nt-dir-item nt-sub" data-sub="${t}||${k}">${k}</div>`).join('')}<br><div class="nt-dir-item" data-back="1">← Back</div>`;}
add(main(),'bot');
msgs.addEventListener('click',e=>{
const m=e.target.closest('[data-main]');if(m){const t=m.dataset.main;add(t,'user');setTimeout(()=>add(sub(t),'bot'),250);return}
const s=e.target.closest('[data-sub]');if(s){const [t,q]=s.dataset.sub.split('||');add(q,'user');setTimeout(()=>add(`<b>${q}</b><br><br>${DATA[t][q]}<br><br>${sub(t)}`,'bot'),300);return}
if(e.target.closest('[data-back]')){add('Back','user');setTimeout(()=>add(main(),'bot'),250)}
});
const inp=document.getElementById('nt-input'),btn=document.getElementById('nt-send');
function ask(){const v=inp.value.trim();if(!v)return;add(v,'user');inp.value='';const l=v.toLowerCase();let ft=null,fq=null;
if(l.includes('fat')||l.includes('oil')||l.includes('grasa')){ft='Origins of cancer';fq='Why fat causes cancer'}
else if(l.includes('taste')||l.includes('sabor')){ft='Origins of cancer';fq='Why tasty but addictive'}
else if(l.includes('obes')||l.includes('diabet')){ft='Origins of cancer';fq='Obesity, diabetes'}
else if(l.includes('immun')){ft='Origins of cancer';fq='Immune system'}
else if(l.includes('old')||l.includes('age')||l.includes('viejo')){ft='Origins of cancer';fq='Why old age'}
else if(l.includes('dizz')||l.includes('nausea')||l.includes('mareo')||l.includes('symptom')){ft='Origins of cancer';fq='Symptoms'}
else if(l.includes('organic')||l.includes('water')||l.includes('agua')){ft='Origins of cancer';fq='Organic food'}
setTimeout(()=>{if(ft)add(`<b>${fq}</b><br><br>${DATA[ft][fq]}<br><br>${sub(ft)}`,'bot');else add(main(),'bot')},400)
}
btn.onclick=ask;inp.onkeydown=e=>{if(e.key==='Enter')ask()}
</script>
</body>
</html>
