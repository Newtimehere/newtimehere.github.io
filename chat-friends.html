<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW TIME - FRIENDS</title>
<style>
body{margin:0;background:#000;font-family:sans-serif}
.nt-hero{position:relative;width:100%;height:90vh;overflow:hidden}
.nt-hero img{width:100%;height:100%;object-fit:cover}
.nt-overlay{position:absolute;inset:0;background:linear-gradient(to top, #000 15%, rgba(0,0,0,0.3))}
.nt-content{position:absolute;bottom:50px;left:24px;right:24px;z-index:2;color:#fff}
.nt-title{font-family:serif;font-size:44px;letter-spacing:10px;font-weight:300;margin:0 0 16px}
.nt-paragraph{font-size:16px;opacity:0.8;max-width:340px;line-height:1.5;margin:0 0 24px}
.nt-explore{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;cursor:pointer}
.nt-circle{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:22px}
.nt-explore-text{letter-spacing:3px;font-size:13px}

/* BOLITA INFERIOR NEGRO + ROJO OSCURO */
#nt-friends-btn{
  position:fixed;bottom:14px;right:14px;width:58px;height:58px;
  background:#0A0A0A;border:1.5px solid rgba(255,255,255,0.15);border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:99999;
  box-shadow:0 4px 20px rgba(0,0,0,0.6);
}
#nt-friends-btn svg{width:28px;height:28px}
.nt-dir-item{display:block;padding:12px 16px;margin:8px 0;background:#000;color:#fff;border-radius:30px;cursor:pointer;font-size:14px}
</style>
</head>
<body>

<!-- TU CODIGO EXACTO PERO AHORA ABRE DIRECTO -->
<div class="nt-hero">
  <img src="time-time.jpg">
  <div class="nt-overlay"></div>
  <div class="nt-content">
    <h2 class="nt-title">FRIENDS</h2>
    <p class="nt-paragraph">At New Time we are not only high-class, high-level. We are day by day, hand in hand with you.</p>
    <a class="nt-explore" href="chat-friends.html" id="nt-explore-direct">
      <div class="nt-circle">→</div>
      <span class="nt-explore-text">EXPLORE FRIENDS</span>
    </a>
  </div>
</div>

<!-- BOLITA -->
<button id="nt-friends-btn">
  <svg viewBox="0 0 24 24" fill="none">
    <path d="M4.5 5.8C4.5 4.4 5.7 3.2 7.1 3.2H16.9C18.3 3.2 19.5 4.4 19.5 5.8V12.2C19.5 13.6 18.3 14.8 16.9 14.8H9.2L4.5 19.5V5.8Z" stroke="#7A0000" stroke-width="1.7" fill="rgba(120,0,0,0.18)"/>
    <circle cx="8.2" cy="9" r="1.4" fill="#B00000"/>
    <circle cx="12" cy="9" r="1.4" fill="#B00000"/>
    <circle cx="15.8" cy="9" r="1.4" fill="#B00000"/>
  </svg>
</button>

<!-- CHAT OVERLAY -->
<div id="nt-chat-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999999; align-items:flex-end; justify-content:center;">
  <div style="background:#fff; width:100%; max-width:500px; height:85vh; border-radius:20px 20px 0 0; display:flex; flex-direction:column;">
    <div style="background:#000; color:#fff; padding:16px; display:flex; justify-content:space-between; align-items:center;">
      <b>NEW TIME - Chat Friends</b><span id="nt-close" style="cursor:pointer; font-size:24px;">✕</span>
    </div>
    <div id="nt-msgs" style="flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:#fff;"></div>
    <div style="padding:12px; border-top:1px solid #ddd; display:flex; gap:8px; background:#fff;">
      <input id="nt-input" placeholder="Ask..." style="flex:1; padding:14px 18px; border:1px solid #ddd; border-radius:30px; outline:none; font-size:16px; color:#000;">
      <button id="nt-send" style="background:#000; color:#fff; border:none; width:52px; height:52px; border-radius:50%; cursor:pointer;">→</button>
    </div>
  </div>
</div>

<script>
const ov=document.getElementById('nt-chat-overlay');
const openChat=()=> ov.style.display='flex';

// BOLITA ABRE CHAT
document.getElementById('nt-friends-btn').onclick=openChat;
// EXPLORE FRIENDS DE TU CODIGO ABRE DIRECTO CHAT (NO VA A chat-friends.html)
document.getElementById('nt-explore-direct').addEventListener('click', (e)=>{
  e.preventDefault(); // bloquea ir a chat-friends.html
  openChat(); // abre directo
});
document.getElementById('nt-close').onclick=()=>ov.style.display='none';
ov.onclick=e=>{ if(e.target===ov) ov.style.display='none'; };

function add(html, who){
  const d=document.createElement('div');
  d.style.cssText= who==='user' ? 'background:#000;color:#fff;padding:12px 16px;border-radius:18px 18px 4px 18px;align-self:flex-end;max-width:80%;font-size:15px;' : 'background:#fff;color:#111;padding:14px 16px;border-radius:18px;border:1px solid #e5e5e5;align-self:flex-start;max-width:92%;line-height:1.6;font-size:15px;';
  if(who==='bot') d.innerHTML=html; else d.textContent=html;
  document.getElementById('nt-msgs').appendChild(d);
  document.getElementById('nt-msgs').scrollTop=document.getElementById('nt-msgs').scrollHeight;
}
const answers={
"Origins of disabled people":"As your friend...",
"Origins of cancer":"Talking to YOU directly as your friend...",
"Same-sex gender fraud mindset":"Look at me as your honest friend...",
"Origins of infidelity":"Infidelity is not a mistake...",
"Origins of suicides":"Suicides mostly are because of love...",
"Origins of being woman and men":"Pleas are always because of fear...",
"Origins of assassins":"Movies of violence...",
"The money and the effect":"Money is a scam...",
"Human love":"Human love is decision not emotion."
};
function makeDir(){ return Object.keys(answers).map(n=>`<div class="nt-dir-item" data-title="${n}">👉 ${n}</div>`).join(''); }
function greeting(){ return `Hey here I am I am Chat Friends from New Time<br><br>${makeDir()}`; }
function showAnswer(t){ return `<b>${t}</b><br><br>${answers[t]}`; }
add(greeting(),'bot');
document.getElementById('nt-msgs').addEventListener('click', e=>{ const it=e.target.closest('.nt-dir-item'); if(!it) return; add(it.dataset.title,'user'); setTimeout(()=> add(showAnswer(it.dataset.title),'bot'),200); });
function ask(){ const inp=document.getElementById('nt-input'); if(!inp.value.trim()) return; const q=inp.value.trim(); add(q,'user'); inp.value=''; const l=q.toLowerCase(); let f=null; if(l.includes('cancer')) f="Origins of cancer"; else if(l.includes('disab')) f="Origins of disabled people"; else if(l.includes('infidel')) f="Origins of infidelity"; else if(l.includes('suicid')) f="Origins of suicides"; else if(l.includes('woman')) f="Origins of being woman and men"; else if(l.includes('assassin')) f="Origins of assassins"; else if(l.includes('money')) f="The money and the effect"; else if(l.includes('same')||l.includes('gender')) f="Same-sex gender fraud mindset"; else if(l.includes('love')) f="Human love"; setTimeout(()=>{ if(f) add(showAnswer(f),'bot'); else add(greeting(),'bot'); },200); }
document.getElementById('nt-send').onclick=ask;
document.getElementById('nt-input').onkeydown=e=>{ if(e.key==='Enter') ask(); };
</script>
</body>
</html>
