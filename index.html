    <script>
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const menuCloseBtn = document.getElementById('menuCloseBtn');
        let isMenuOpen = false;

        function openMenu() {
            isMenuOpen = true;
            mobileMenu.classList.add('active');
            menuOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            isMenuOpen = false;
            mobileMenu.classList.remove('active');
            menuOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        menuBtn.addEventListener('click', () => {
            isMenuOpen ? closeMenu() : openMenu();
        });

        menuCloseBtn.addEventListener('click', closeMenu);
        menuOverlay.addEventListener('click', closeMenu);

        document.querySelectorAll('.mobile-nav-link').forEach(link => {
            if (link.id !== 'forYoungLink') {
                link.addEventListener('click', () => {
                    closeMenu();
                });
            }
        });

        // NUEVO: Modal For The Young
        const youngModal = document.getElementById('youngModal');
        const forYoungLink = document.getElementById('forYoungLink');
        const youngModalClose = document.getElementById('youngModalClose');

        function openYoungModal(e) {
            if (e) e.preventDefault();
            youngModal.classList.add('active');
            document.body.style.overflow = 'hidden';
            closeMenu();
        }

        function closeYoungModal() {
            youngModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        forYoungLink.addEventListener('click', openYoungModal);
        youngModalClose.addEventListener('click', closeYoungModal);
        youngModal.addEventListener('click', (e) => {
            if (e.target === youngModal) closeYoungModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (isMenuOpen) closeMenu();
                if (youngModal.classList.contains('active')) closeYoungModal();
            }
        });

        const cookieBanner = document.getElementById('cookieBanner');
        const acceptNecessary = document.getElementById('acceptNecessary');
        const acceptAll = document.getElementById('acceptAll');

        setTimeout(() => {
            if (!localStorage.getItem('cookieConsent')) {
                cookieBanner.classList.add('visible');
                document.body.classList.add('cookie-visible');
            }
        }, 800);

        function hideCookieBanner() {
            cookieBanner.classList.remove('visible');
            document.body.classList.remove('cookie-visible');
        }

        acceptNecessary.addEventListener('click', () => {
            localStorage.setItem('cookieConsent', 'necessary');
            hideCookieBanner();
        });

        acceptAll.addEventListener('click', () => {
            localStorage.setItem('cookieConsent', 'all');
            hideCookieBanner();
        });

        // AUDIO LOGIC - Tocas bocina suena audio, tocas nombre abre PDF
        let currentAudio = null;
        let currentBtn = null;

        document.querySelectorAll('.audio-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                const audioSrc = this.getAttribute('data-audio');
                
                if (currentAudio && currentBtn === this) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentBtn.classList.remove('playing');
                    currentAudio = null;
                    currentBtn = null;
                    return;
                }
                
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    if (currentBtn) currentBtn.classList.remove('playing');
                }
                
                currentAudio = new Audio(audioSrc);
                currentBtn = this;
                
                currentAudio.play().then(() => {
                    this.classList.add('playing');
                }).catch(err => {
                    console.error('Error al reproducir:', audioSrc, err);
                    alert('No se pudo cargar: ' + audioSrc + '\nVerifica que el archivo existe.');
                    this.classList.remove('playing');
                });
                
                currentAudio.addEventListener('ended', () => {
                    if (currentBtn) currentBtn.classList.remove('playing');
                    currentAudio = null;
                    currentBtn = null;
                });
            });
        });
    </script>
