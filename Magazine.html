<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEW TIME MAGAZINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    html, body {
        height: 100%;
        width: 100%;
        background-color: #000000;
    }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding: 20px 16px;
    }

    .content-wrapper {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
    }

    .magazine-title {
        font-family: 'Cormorant Garamond', serif;
        font-size: clamp(24px, 6vw, 42px);
        font-weight: 400;
        letter-spacing: clamp(3px, 1.5vw, 8px);
        color: #ffffff;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: clamp(16px, 3vh, 28px);
        margin-top: clamp(10px, 2vh, 20px);
        line-height: 1;
        white-space: nowrap;
    }

    .magazine-image {
        width: 100%;
        height: auto;
        flex: 1;
        object-fit: contain;
        display: block;
        box-shadow: 0 10px 40px rgba(255,255,255,0.1);
        margin-bottom: clamp(16px, 3vh, 28px);
        min-height: 0;
    }

    .magazine-link {
        align-self: flex-start;
        font-family: 'Inter', sans-serif;
        font-size: clamp(12px, 2.5vw, 14px);
        font-weight: 500;
        letter-spacing: 1.5px;
        color: #ffffff;
        text-decoration: none;
        text-transform: uppercase;
        padding: clamp(8px, 2vw, 10px) clamp(18px, 4vw, 24px);
        border: 1px solid #ffffff;
        transition: all 0.3s ease;
        margin-bottom: clamp(10px, 2vh, 20px);
    }

    .magazine-link:hover {
        background-color: #ffffff;
        color: #000000;
    }
</style>
</head>
<body>
    <div class="content-wrapper">
        <h1 class="magazine-title">NEW TIME MAGAZINE</h1>
        <img class="magazine-image" src="magazine-666.jpg" alt="New Time Magazine">
        <a href="https://online.fliphtml5.com/xehyf/SHINE/" class="magazine-link" target="_blank">SEE MAGAZINE</a>
    </div>
</body>
</html>
